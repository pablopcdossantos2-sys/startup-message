name: build-msix

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - run: pip install -r requirements-lock.txt
      - name: Verify WinRT APIs used by the MSIX app
        run: python -c "from winrt.windows.applicationmodel import StartupTask; from winrt.windows.storage import ApplicationData; print('WinRT OK')"
      - run: python -m pytest -q
      - name: Validate PowerShell build and installer scripts
        shell: pwsh
        run: |
          $scripts = @(
            "packaging/build.ps1",
            "packaging/validate_msix.ps1",
            "packaging/Install-StartupMessage-Test.ps1"
          )
          foreach ($script in $scripts) {
            $tokens = $null
            $errorsFound = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $script).Path, [ref]$tokens, [ref]$errorsFound
            ) | Out-Null
            if ($errorsFound.Count -gt 0) {
              $errorsFound | ForEach-Object { Write-Host $_.ToString() }
              throw "Erro de sintaxe PowerShell em $script"
            }
          }
      - name: Validate MSIX version and release tag
        shell: pwsh
        env:
          GIT_REF: ${{ github.ref }}
          GIT_REF_NAME: ${{ github.ref_name }}
        run: |
          if ($env:GIT_REF -like "refs/tags/*") {
            python versioning.py --tag $env:GIT_REF_NAME
          } else {
            python versioning.py
          }
          if ($LASTEXITCODE -ne 0) { throw "Versionamento MSIX inválido" }
      - name: Build MSIX
        shell: pwsh
        env:
          MSIX_IDENTITY_NAME: ${{ vars.MSIX_IDENTITY_NAME || 'pablopcdsantos.DailyMessage' }}
          MSIX_PUBLISHER: ${{ vars.MSIX_PUBLISHER || 'CN=A3E973B8-1411-4314-B754-F3DADD99C070' }}
          MSIX_PUBLISHER_DISPLAY_NAME: ${{ vars.MSIX_PUBLISHER_DISPLAY_NAME || 'pablopcdsantos' }}
          MSIX_DISPLAY_NAME: ${{ vars.MSIX_DISPLAY_NAME || 'StartupMessage' }}
        run: |
          $identity = if ($env:MSIX_IDENTITY_NAME) { $env:MSIX_IDENTITY_NAME } else { "pablopcdsantos.DailyMessage" }
          $publisher = if ($env:MSIX_PUBLISHER) { $env:MSIX_PUBLISHER } else { "CN=A3E973B8-1411-4314-B754-F3DADD99C070" }
          $publisherDisplay = if ($env:MSIX_PUBLISHER_DISPLAY_NAME) { $env:MSIX_PUBLISHER_DISPLAY_NAME } else { "pablopcdsantos" }
          $display = if ($env:MSIX_DISPLAY_NAME) { $env:MSIX_DISPLAY_NAME } else { "StartupMessage" }
          ./packaging/build.ps1 -IdentityName $identity -Publisher $publisher -PublisherDisplayName $publisherDisplay -DisplayName $display -SignTest
      - name: Install and validate the signed MSIX package
        shell: pwsh
        env:
          MSIX_IDENTITY_NAME: ${{ vars.MSIX_IDENTITY_NAME || 'pablopcdsantos.DailyMessage' }}
        run: |
          $identity = if ($env:MSIX_IDENTITY_NAME) { $env:MSIX_IDENTITY_NAME } else { "pablopcdsantos.DailyMessage" }
          ./packaging/validate_msix.ps1 -MsixPath "release/StartupMessage-validation.msix" -IdentityName $identity
      - name: Create test installation kit
        shell: pwsh
        run: |
          $kit = "release/test-kit"
          New-Item -ItemType Directory -Force $kit | Out-Null
          Copy-Item "release/StartupMessage-validation.msix" $kit
          Copy-Item "release/StartupMessage-test.cer" $kit
          Copy-Item "packaging/Install-StartupMessage-Test.ps1" $kit
          Copy-Item "packaging/Install-StartupMessage-Test.cmd" $kit
          Copy-Item "docs/INSTALL_TEST_PACKAGE.md" (Join-Path $kit "LEIA-ANTES-DE-INSTALAR.md")
          Compress-Archive -Path "$kit/*" -DestinationPath "release/StartupMessage-MSIX-TEST.zip" -Force
      - name: Upload test installation kit
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: StartupMessage-MSIX-TEST-KIT
          path: release/StartupMessage-MSIX-TEST.zip
      # Enquanto a arte final e o contato de privacidade não forem validados,
      # não declarar nenhum pacote como pronto para submissão à Microsoft Store.
      - name: Upload MSIX unsigned for validation only
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: StartupMessage-MSIX-VALIDATION-ONLY
          path: release/StartupMessage_*.msix
